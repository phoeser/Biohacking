# Meldet geänderte Seiten nach jedem Deploy automatisch per IndexNow an Bing
# (Bing ist auch die Suchgrundlage von ChatGPT und Copilot).
# Der IndexNow-Schlüssel ist öffentlich (liegt als .txt im Web-Root) – kein Geheimnis.
name: IndexNow

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      alle:
        description: "Alle URLs aus der Sitemap melden"
        type: boolean
        default: false

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  melden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Warten, bis GitHub Pages neu ausgeliefert hat
        run: sleep 120

      - name: Geänderte Seiten melden
        env:
          VORHER: ${{ github.event.before }}
          NACHHER: ${{ github.sha }}
          ALLE: ${{ github.event.inputs.alle }}
        run: |
          python3 - <<'EOF'
          import json, os, re, subprocess, urllib.request

          DOMAIN = "https://biohackingkompakt.de"
          KEY = "d677647f0731cb1b0f245820ab99316d"
          GESPERRT = ("podcast-scripts/", "docs/", "demo/", "stimmtest")

          def url_fuer(pfad):
              if not pfad.endswith(".html") or pfad.startswith(GESPERRT):
                  return None
              if pfad == "index.html":
                  return DOMAIN + "/"
              if pfad.endswith("/index.html"):
                  return DOMAIN + "/" + pfad[: -len("index.html")]
              return DOMAIN + "/" + pfad

          urls = set()
          vorher, nachher = os.environ.get("VORHER", ""), os.environ["NACHHER"]
          if os.environ.get("ALLE") == "true":
              sm = open("sitemap.xml", encoding="utf-8").read()
              urls.update(re.findall(r"<loc>([^<]+)</loc>", sm))
          elif vorher and not set(vorher) <= {"0"}:
              dateien = subprocess.run(
                  ["git", "diff", "--name-only", "--diff-filter=AM", vorher, nachher],
                  capture_output=True, text=True, check=True).stdout.split()
              for d in dateien:
                  u = url_fuer(d)
                  if u:
                      urls.add(u)
                  if d.startswith("js/data/"):
                      urls.add(DOMAIN + "/")
          if not urls:
              print("Keine geänderten Seiten – nichts zu melden.")
              raise SystemExit(0)

          urls = sorted(urls)[:10000]
          body = json.dumps({
              "host": "biohackingkompakt.de",
              "key": KEY,
              "keyLocation": f"{DOMAIN}/{KEY}.txt",
              "urlList": urls,
          }).encode()
          req = urllib.request.Request(
              "https://www.bing.com/indexnow", data=body,
              headers={"Content-Type": "application/json; charset=utf-8"})
          with urllib.request.urlopen(req, timeout=30) as r:
              print(f"IndexNow: {len(urls)} URLs gemeldet, Antwort {r.status}")
          for u in urls[:50]:
              print("  ", u)
          EOF
